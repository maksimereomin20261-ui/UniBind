<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>UniBind — меню</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",Arial,sans-serif;color:#eeeaf1;background:#1c1b20}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{padding:1px;background:#1c1b20;user-select:none}.shell{height:100%;border:1px solid #49404f;border-radius:10px;padding:4px;background:linear-gradient(145deg,#222027,#1b1a1f);overflow:hidden}nav{height:100%;display:flex;flex-direction:column}button{appearance:none;border:0;background:transparent;color:inherit;font:400 13px "Segoe UI",Arial,sans-serif;width:100%;height:30px;flex:0 0 30px;display:flex;align-items:center;text-align:left;gap:10px;padding:0 10px;border-radius:5px;white-space:nowrap;cursor:pointer}button:hover,button:focus-visible{outline:none;background:#34303b}button:focus-visible{box-shadow:inset 0 0 0 1px #9575bc}button.primary{height:32px;flex-basis:32px;font-weight:600;background:#302a38;color:#f2eaf9}button.primary:hover,button.primary:focus-visible{background:#3c3248}button:disabled{color:#817b87;cursor:default}button:disabled .icon{stroke:#70697a}.icon{width:16px;height:16px;flex:none;stroke:#b393d6;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none}.primary .icon{color:#c9a2f0;stroke:#c9a2f0}.sep{height:1px;flex:0 0 1px;background:#3c3641;margin:4px 9px}@media(prefers-reduced-motion:no-preference){button{transition:background .12s ease,box-shadow .12s ease}}
</style></head><body><div class="shell"><nav role="menu" aria-label="Меню UniBind">
<button role="menuitem" class="primary" data-action="open"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M13 1 4 14h6l-1 9 11-14h-7z"/></svg><span>Открыть UniBind</span></button>
<div class="sep" role="separator"></div>
<button role="menuitem" data-action="settings"><svg class="icon" viewBox="0 0 24 24"><path d="M9.6 2.8h4.8l.6 2.4 2.2.9 2.1-1.3 3.4 3.4-1.3 2.1.9 2.2 2.4.6v4.8l-2.4.6-.9 2.2 1.3 2.1-3.4 3.4-2.1-1.3-2.2.9-.6 2.4H9.6L9 21.9l-2.2-.9-2.1 1.3-3.4-3.4 1.3-2.1-.9-2.2-2.4-.6v-4.8l2.4-.6.9-2.2L1.3 8.2l3.4-3.4 2.1 1.3L9 5.2z" transform="translate(2 1) scale(.83)"/><circle cx="12" cy="12" r="3"/></svg><span>Настройки</span></button>
<button role="menuitem" data-action="profile"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></svg><span>Профиль игрока</span></button>
<button role="menuitem" data-action="variables"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="18" rx="2"/><path d="M9 4V2h6v2M8 10h8M8 15h8"/></svg><span>Переменные</span></button>
<div class="sep" role="separator"></div>
<button role="menuitem" data-action="binds"><svg class="icon" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Папка биндов</span></button>
<div class="sep" role="separator"></div>
<button role="menuitem" data-action="overlay"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="11" rx="2"/><path d="M8 18h8M12 14v4M5 21h14"/></svg><span>Оверлей (показать/скрыть)</span></button>
<button role="menuitem" data-action="overlay-settings"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2l2 .7 1 2 2.2.7 2-.7 1.6 1.6-.7 2 .7 2.2 2 1-.7 3-2 .8-.7 2.2.7 2-1.6 1.6-2-.7-2.2.7-1 2-3-.7-.8-2-2.2-.7-2 .7L3 19.1l.7-2-.7-2.2-2-1 .7-3 2-.8.7-2.2-.7-2L5.3 4.3l2 .7 2.2-.7 1-2z" transform="translate(1 0) scale(.92)"/><circle cx="12" cy="12" r="3"/></svg><span>Настройка Overlay</span></button>
<button role="menuitem" data-action="reload"><svg class="icon" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-3L3 8M3 3v5h5M4 16a8 8 0 0 0 14 3l3-3M21 21v-5h-5"/></svg><span>Перезагрузить</span></button>
<button role="menuitem" data-action="suspend"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg><span>Приостановить хоткеи</span></button>
<div class="sep" role="separator"></div>
<button role="menuitem" data-action="exit"><svg class="icon" viewBox="0 0 24 24"><path d="M11 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6M14 7l5 5-5 5M8 12h11"/></svg><span>Выход</span></button>
</nav></div><script>
const buttons=[...document.querySelectorAll('button')];
buttons.forEach(button=>button.addEventListener('click',()=>window.chrome?.webview?.postMessage(button.dataset.action)));
window.addEventListener('keydown',event=>{if(event.key==='Escape'){window.chrome?.webview?.postMessage('dismiss');return}let index=buttons.indexOf(document.activeElement);if(event.key==='ArrowDown'||event.key==='ArrowUp'||event.key==='Home'||event.key==='End'){event.preventDefault();index=event.key==='Home'?0:event.key==='End'?buttons.length-1:event.key==='ArrowDown'?(index+1)%buttons.length:(index<=0?buttons.length-1:index-1);buttons[index].focus()}});
window.chrome?.webview?.addEventListener('message',event=>{if(event.data==='suspended'||event.data==='active'){let button=document.querySelector('[data-action="suspend"]');button.querySelector('span').textContent=event.data==='suspended'?'Возобновить хоткеи':'Приостановить хоткеи'}});
</script></body></html>
