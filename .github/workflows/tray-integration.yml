name: Проверить все команды трея в UniBind
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-real-app:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Скачать проверенный AutoHotkey
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.31/AutoHotkey_2.0.31.zip' -OutFile ahk.zip
          if ((Get-FileHash ahk.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ca1a595aca4528755d8d4cd7fed23d497a37bd9a0b6892072612d68dee1bd00a') { throw 'SHA-256 mismatch' }
          Expand-Archive ahk.zip .tools/ahk
      - name: Проверить настоящее приложение в изолированной папке
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = Get-Content app/UniBind.ahk -Raw -Encoding UTF8
          $pattern = '(?m)^Main\(\)\r?\n\r?\nOnExit\(CleanupOnExit\)'
          if ([regex]::Matches($original, $pattern).Count -ne 1) { throw 'Could not attach test to application' }
          $replacement = "Main()`r`n`r`nOnExit(CleanupOnExit)`r`nSetTimer(TrayIntegrationTests, -3500)"
          $instrumented = [regex]::Replace($original, $pattern, $replacement) + "`r`n#Include tests\tray-integration.ahk`r`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD 'app/UniBind-TrayTest.ahk'), $instrumented, [System.Text.UTF8Encoding]::new($true))
          $env:UNIBIND_TRAY_TEST_DIR = Join-Path $env:RUNNER_TEMP 'unibind-tray-test'
          $env:UNIBIND_DATA_DIR = Join-Path $env:UNIBIND_TRAY_TEST_DIR 'data'
          New-Item -ItemType Directory -Force $env:UNIBIND_TRAY_TEST_DIR | Out-Null
          $exe = (Resolve-Path '.tools/ahk/AutoHotkey64.exe').Path
          $src = (Resolve-Path 'app/UniBind-TrayTest.ahk').Path
          $p = Start-Process -FilePath $exe -ArgumentList @('/ErrorStdOut', ('"{0}"' -f $src)) -PassThru -RedirectStandardError tray-error.txt
          for ($i=0; $i -lt 150; $i++) {
            if ((Test-Path "$env:UNIBIND_TRAY_TEST_DIR/done") -or (Test-Path "$env:UNIBIND_TRAY_TEST_DIR/failed")) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path "$env:UNIBIND_TRAY_TEST_DIR/result.txt") { Get-Content "$env:UNIBIND_TRAY_TEST_DIR/result.txt" }
          if (Test-Path tray-error.txt) { Get-Content tray-error.txt }
          if (Test-Path "$env:UNIBIND_TRAY_TEST_DIR/failed") { throw 'A tray integration assertion failed' }
          if (!(Test-Path "$env:UNIBIND_TRAY_TEST_DIR/done")) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'Tray integration test timed out' }
