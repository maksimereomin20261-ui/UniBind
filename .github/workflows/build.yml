name: Собрать UniBind (без публикации)
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['installer/**', 'app/**', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Проверить и скачать официальные инструменты
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          $sources = @(
            @{ url = 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.31/AutoHotkey_2.0.31.zip'; path = '.tools/ahk.zip'; sha = 'ca1a595aca4528755d8d4cd7fed23d497a37bd9a0b6892072612d68dee1bd00a' },
            @{ url = 'https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip'; path = '.tools/compiler.zip'; sha = 'c29b8c3a5124850d79fc9e66e2ca79677c377d7f31631ad3022ba159c5d9e3be' }
          )
          foreach ($s in $sources) {
            Invoke-WebRequest -Uri $s.url -OutFile $s.path
            if ((Get-FileHash $s.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $s.sha) { throw 'SHA-256 mismatch' }
          }
          Expand-Archive .tools/ahk.zip .tools/ahk
          Expand-Archive .tools/compiler.zip .tools/compiler
      - name: Собрать приложение и загрузчик
        shell: pwsh
        run: |
          python -m pip install -r installer/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller installation failed' }
          ./app/tools/Build-Payload.ps1 -Ahk2Exe (Resolve-Path '.tools/compiler/Ahk2Exe.exe').Path -AutoHotkey (Resolve-Path '.tools/ahk/AutoHotkey64.exe').Path -OutputDirectory (Join-Path $PWD 'build/payload') -Icon (Resolve-Path 'installer/UniBind.ico').Path -LicenseFile (Resolve-Path '.tools/ahk/license.txt').Path -LogDirectory (Join-Path $PWD 'build')
          Compress-Archive -Path build/payload/* -DestinationPath build/UniBind-App.zip
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name UniBind_Setup --icon installer/UniBind.ico installer/launcher.py
          if ($LASTEXITCODE -ne 0 -or !(Test-Path dist/UniBind_Setup.exe)) { throw 'Launcher build failed' }
          Copy-Item dist/UniBind_Setup.exe build/UniBind_Setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniBind-Windows-unverified
          path: |
            build/UniBind-App.zip
            build/UniBind_Setup.exe
          if-no-files-found: error
