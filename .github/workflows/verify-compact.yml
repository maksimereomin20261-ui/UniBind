name: Verify compact installer on Windows
on:
  workflow_call:
  push:
    branches: [main]
    paths: ['installer/**', '.github/workflows/verify-compact.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run installer and UI tests
        shell: pwsh
        run: |
          python -m unittest discover -s installer -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed' }

