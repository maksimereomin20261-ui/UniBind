name: Публикация тестовой версии UniBind
on:
  push:
    branches: [unibind-next]
    paths: ['.github/workflows/publish-test.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Получить результаты успешной сборки
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download 41811745567 --name UniBind-Windows-unverified --dir release-files
          if ($LASTEXITCODE -ne 0) { throw 'Could not download build artifact' }
          foreach ($f in @('UniBind-App.zip','UniBind_Setup.exe')) {
            if (!(Test-Path (Join-Path release-files $f))) { throw "Missing $f" }
          }
          Copy-Item release-files/UniBind-App.zip release-files/UniBind_Payload.zip
      - name: Создать тестовый релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          ВНИМАНИЕ: это тестовая версия. Приложение, установщик и обновление не проверены на Windows 11 и в игре. Не считайте её стабильной.

          Скачайте и запустите UniBind_Setup.exe. При первом запуске нужен интернет; загрузчик скачает UniBind-App.zip. Нужен Microsoft Edge WebView2 Runtime. Старые настройки автоматически не переносятся — сохраняйте резервную копию.

          Файл UniBind_Payload.zip оставлен для совместимости со старым установщиком. Новому пользователю нужен только UniBind_Setup.exe.
          '@ | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          gh release create v1.1.0-test1 release-files/UniBind_Setup.exe release-files/UniBind-App.zip release-files/UniBind_Payload.zip --target "$env:GITHUB_SHA" --title 'UniBind 1.1.0 — тестовая версия' --notes-file release-notes.txt --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish test release' }
