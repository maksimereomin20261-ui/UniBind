name: Publish redesigned test setup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-design.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Download verified build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download 41817836008 --name UniBind-Windows-unverified --dir release-files
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          foreach ($f in @('UniBind-App.zip', 'UniBind_Setup.exe')) {
            if (-not (Test-Path "release-files/$f")) { throw "Missing asset $f" }
          }
          Copy-Item 'release-files/UniBind-App.zip' 'release-files/UniBind_Payload.zip'
      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          UniBind 2027.10 Beta 1 Hotfix 2 — тестовая сборка с новым окном установки.

          Работу приложения, установки и обновлений на Windows 11 ещё не проверяли.
          Скачайте UniBind_Setup.exe. Может потребоваться WebView2 Runtime.
          Для обновления старого загрузчика закройте UniBind и запустите новый Setup один раз.
          Существующие настройки в папке данных сохраняются; настройки из прежней версии не переносятся автоматически.
          UniBind_Payload.zip нужен для совместимости со старым установщиком.
          '@ | Set-Content -Encoding utf8 release-notes.txt
          gh release create v2027.10-beta.1-hf2-test2 release-files/UniBind_Setup.exe release-files/UniBind-App.zip release-files/UniBind_Payload.zip --target "$env:GITHUB_SHA" --title 'UniBind 2027.10 Beta 1 Hotfix 2 — тестовая версия' --notes-file release-notes.txt --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
