name: Publish UniBind test update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-test4.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Download tested build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download 41825372383 --name UniBind-Windows-unverified --dir release-files
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          foreach ($f in @('UniBind-App.zip', 'UniBind_Setup.exe')) {
            if (-not (Test-Path "release-files/$f")) { throw "Missing asset $f" }
          }
          Copy-Item 'release-files/UniBind-App.zip' 'release-files/UniBind_Payload.zip'
      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          UniBind 2027.10 Beta 1 Hotfix 2 — тестовая сборка.

          В приложение встроена иконка UniBind для системного трея. Загрузчик после запуска удаляет старые версии приложения, сохраняя пользовательские настройки и бинды в отдельной папке. Автоматический откат после удаления недоступен.
          Для обновления самого загрузчика закройте UniBind, скачайте и запустите UniBind_Setup.exe один раз. Дальнейшие обновления приложения проверяются при запуске через ярлык.
          Автоматические тесты загрузчика и очистки выполнены на Windows. Полный запуск приложения на Windows 11 и работу с игрой ещё не проверяли. Может потребоваться WebView2 Runtime. Старые настройки из предыдущих вариантов не переносятся автоматически.
          UniBind_Payload.zip нужен для совместимости со старым загрузчиком.
          '@ | Set-Content -Encoding utf8 release-notes.txt
          gh release create v2027.10-beta.1-hf2-test4 release-files/UniBind_Setup.exe release-files/UniBind-App.zip release-files/UniBind_Payload.zip --target "$env:GITHUB_SHA" --title 'UniBind 2027.10 Beta 1 Hotfix 2 — тестовая версия 4' --notes-file release-notes.txt --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
